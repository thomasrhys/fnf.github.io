<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Friday Night Funkin'</title>
    <meta name="description" content="A rhythm game made with HaxeFlixel" />
    <meta name="author" content="thomasrhys">
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="/" />
    <meta name="twitter:title" content="Friday Night Funkin'" />
    <meta name="twitter:description" content="A rhythm game made with HaxeFlixel" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Friday Night Funkin'">
    <meta name="apple-mobile-web-app-status-bar-style" content="translucent-black">
    <meta name="format-detection" content="telephone=no">
    <meta name="application-name" content="Friday Night Funkin'">
    <meta name="theme-color" content="#000">
    <meta property="og:title" content="Friday Night Funkin'" />
    <meta property="og:site_name" content="Friday Night Funkin'" />
    <meta property="og:description" content="A rhythm game made with HaxeFlixel" />
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="shortcut icon" href="./icon.png">
    <style>
        body {
            background: black;
            color: white;
            font-family: monospace;
            overflow: hidden;
            font-size: 14pt;
            margin: 0;
            padding: 0;
        }

        .embed {
            background: transparent;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 1.5em);
            border: none;
        }

        .nofooter iframe {
            height: 100%;
        }

        footer {
            color: grey;
            position: absolute;
            bottom: 0;
            width: 100%;
            left: 0;
            z-index: 100;
            text-align: center;
            font-size: 1em;
            margin-bottom: 0.25em;
        }

        footer a {
            color: grey;
        }

        .embed footer,
        .embed footer a {
            color: black;
        }

        #fullscreen {
            position: absolute;
            right: 0.25rem;
            bottom: 0;
            cursor: pointer;
        }

        .lds-ripple {
            width: 80px;
            height: 80px;
            margin: auto;
            position: absolute;
            margin: auto;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: -1;
        }

        .lds-ripple div {
            position: absolute;
            border: 4px solid #fff;
            opacity: 1;
            border-radius: 50%;
            animation: lds-ripple 1s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        }

        .lds-ripple div:nth-child(2) {
            animation-delay: -0.5s;
        }

        @keyframes lds-ripple {
            0% {
                top: 36px;
                left: 36px;
                width: 0;
                height: 0;
                opacity: 1;
            }

            100% {
                top: 0px;
                left: 0px;
                width: 72px;
                height: 72px;
                opacity: 0;
            }
        }
    </style>
</head>

<body id="root">
    <div id="loader" class="lds-ripple">
        <div></div>
        <div></div>
    </div>
    <iframe id="simframe" src="./build/html5/index.html" allowfullscreen="allowfullscreen">
    </iframe>
    <footer id="footer">
        <a target="blank" rel="nofollow noopener" href="https://www.newgrounds.com/portal/view/770371">Play on Newgrounds</a>
        <a target="blank" rel="nofollow noopener" href="https://github.com/thomasrhys/fnf.github.io">GitHub</a>
        <span id="version"></span>
        <div id="fullscreen">⇲</div>
    </footer>
    <script>
        // Remove loader when game is ready
        window.addEventListener('load', function() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.remove();
            }
        });

        // Fullscreen functionality
        if (window.location && window.location.search) {
            var noFooter = /nofooter=1/i.test(window.location.search);
            var embed = /embed=1/i.test(window.location.search);
            var root = document.querySelector("#root");

            if (noFooter) {
                var footer = document.querySelector("#footer");
                if (root)
                    root.className += " nofooter";
                if (footer)
                    footer.remove();
            }

            if (embed && root) {
                root.className += " embed";
            }
        }

        // Fullscreen button handler
        var sim = document.getElementById("simframe");
        var fs = document.getElementById("fullscreen");
        if (fs && sim.requestFullscreen) {
            fs.onclick = function() { sim.requestFullscreen(); }
        } else if (fs) {
            fs.remove();
        }
    </script>
</body>

</html>
