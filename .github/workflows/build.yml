name: Build and Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Haxe
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.3.7

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 16

    - name: Install Haxelib dependencies
      run: |
        haxelib newrepo
        haxelib install hxp
        haxelib install hxcpp
        haxelib install lime
        haxelib install openfl
        haxelib install flixel
        haxelib install flixel-addons
        haxelib install flixel-ui
        haxelib install hscript

    - name: Debug environment
      run: |
        haxe -version
        haxelib list

    # IMPORTANT: initialise HXProject properly
    - name: Initialise HXProject
      run: |
        echo "Initialising hxp project system..."
        haxelib run hxp project.hxp html5

    - name: Build HTML5
      run: |
        haxelib run hxp project.hxp
        haxelib run lime build html5

    - name: Locate output
      run: |
        find . -type d -name "html5" || true
        find . -type d -name "export" || true

    - name: Prepare Pages folder
      run: |
        mkdir -p public

        if [ -d "export/release/html5/bin" ]; then
          cp -r export/release/html5/bin/* public/
        elif [ -d "export/html5/bin" ]; then
          cp -r export/html5/bin/* public/
        elif [ -d "export/release/html5" ]; then
          cp -r export/release/html5/* public/
        else
          echo "ERROR: No build output found"
          ls -R
          exit 1
        fi

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
