name: Build and Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ----------------------------
    # Checkout (WITH SUBMODULES)
    # ----------------------------
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # ----------------------------
    # Cache Haxelib (speed boost)
    # ----------------------------
    - name: Cache Haxelib
      uses: actions/cache@v4
      with:
        path: ~/.haxelib
        key: haxelib-${{ runner.os }}
        restore-keys: haxelib-

    # ----------------------------
    # Setup Haxe
    # ----------------------------
    - name: Setup Haxe
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.3.7

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 16

    # ----------------------------
    # Install dependencies (FIXED)
    # ----------------------------
    - name: Install Haxelib dependencies
      run: |
        haxelib newrepo
        haxelib install hxp
        haxelib install lime 8.3.2
        haxelib install openfl 9.5.2
        haxelib install flixel 6.1.2
        haxelib install flixel-addons
        haxelib install flixel-ui
        haxelib install hscript

    # ----------------------------
    # Debug (VERY IMPORTANT for FNF builds)
    # ----------------------------
    - name: Debug environment
      run: |
        haxe -version
        haxelib list

    # ----------------------------
    # Build HTML5
    # ----------------------------
    - name: Build HTML5
      run: |
        echo "Building FNF HTML5..."
        haxelib run lime build html5 -final

    # ----------------------------
    # Prepare Pages folder
    # ----------------------------
    - name: Prepare Pages folder
      run: |
        mkdir -p public

        if [ -d "export/release/html5/bin" ]; then
          cp -r export/release/html5/bin/* public/
        elif [ -d "export/html5/bin" ]; then
          cp -r export/html5/bin/* public/
        else
          echo "Build output not found"
          ls -R
          exit 1
        fi

    # ----------------------------
    # Upload artifact
    # ----------------------------
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
