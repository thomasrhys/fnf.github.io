name: Build and Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Haxe
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.2.5

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 16

    - name: Install dependencies
      run: |
        haxelib newrepo
        haxelib install hxp
        haxelib install hxcpp
        haxelib install lime 8.1.1
        haxelib install openfl 9.3.3
        haxelib install flixel 5.6.2
        haxelib install flixel-addons
        haxelib install flixel-ui
        haxelib install hscript

    - name: Setup Lime
      run: |
        haxelib run lime setup

    - name: Build HTML5
      run: |
        haxelib run lime build html5

    - name: Locate build output
      run: |
        echo "Searching for HTML5 build output..."
        find . -type d -name "html5" || true

    - name: Prepare Pages folder
      run: |
        mkdir -p public

        # Most FNF builds output here:
        if [ -d "export/release/html5/bin" ]; then
          cp -r export/release/html5/bin/* public/
        elif [ -d "export/html5/bin" ]; then
          cp -r export/html5/bin/* public/
        elif [ -d "build/html5" ]; then
          cp -r build/html5/* public/
        else
          echo "ERROR: No HTML5 output found"
          ls -R
          exit 1
        fi

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
